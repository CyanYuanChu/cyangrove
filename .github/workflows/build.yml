name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-modular.sh
      - run: ./scripts/check-modular.sh
  native-integration:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/checkout-modules.py cyan-command cyan-monitor cyan-codex-usage cyan-github cyan-passport
      - run: python3 scripts/test-native-modules.py
